<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zero-Exposure RAG — Red-Team Dashboard</title>
<style>
  :root {
    --bg: #0D1117;
    --panel: #161B22;
    --panel-border: #30363D;
    --text: #E6EDF3;
    --text-dim: #8B949E;
    --safe: #3FB950;
    --leak: #F85149;
    --accent: #58A6FF;
    --sans: -apple-system, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", "Consolas", "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
  }
  a { color: var(--accent); }

  .shell {
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
  }

  /* --- Left rail --- */
  .rail {
    border-right: 1px solid var(--panel-border);
    padding: 24px 20px;
    background: var(--panel);
  }
  .rail h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 2px;
    letter-spacing: -0.01em;
  }
  .rail .sub {
    color: var(--text-dim);
    font-size: 12px;
    margin: 0 0 28px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  select, input, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 8px 10px;
    font-family: var(--sans);
    font-size: 13px;
    border-radius: 4px;
  }
  select:focus, input:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  textarea { resize: vertical; min-height: 64px; }
  button {
    width: 100%;
    background: var(--accent);
    color: #0D1117;
    border: none;
    padding: 9px 10px;
    font-weight: 600;
    font-size: 13px;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .live-answer {
    margin-top: 16px;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 10px;
    font-size: 12.5px;
    display: none;
  }
  .live-answer.show { display: block; }
  .live-answer .tag {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 3px;
    margin-bottom: 8px;
  }
  .tag.answered { background: rgba(63,185,80,.15); color: var(--safe); }
  .tag.blocked { background: rgba(248,81,73,.15); color: var(--leak); }
  .live-answer .answer-text { color: var(--text-dim); margin-bottom: 8px; }

  .live-answer .meta { color: var(--text-dim); font-family: var(--mono); font-size: 11px; }

  .live-answer .meta { color: var(--text-dim); font-family: var(--mono); font-size: 11px; line-height: 1.4; word-break: break-word; }


  /* --- Main --- */
  main { padding: 28px 32px; max-width: 1040px; }
  .section-title {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0 0 12px;
    font-weight: 600;
  }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1px;
    background: var(--panel-border);
    border: 1px solid var(--panel-border);
    margin-bottom: 32px;
  }
  .tile {
    background: var(--panel);
    padding: 16px;
  }
  .tile .num {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 600;
    line-height: 1;
  }
  .tile .num.safe { color: var(--safe); }
  .tile .num.leak { color: var(--leak); }
  .tile .label {
    color: var(--text-dim);
    font-size: 11.5px;
    margin-top: 6px;
  }

  .chart-panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    padding: 20px;
    margin-bottom: 32px;
  }
  .chart-panel canvas { max-height: 280px; }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    font-size: 12.5px;
  }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--panel-border);
    font-family: var(--mono);
  }
  th {
    color: var(--text-dim);
    font-family: var(--sans);
    font-weight: 600;
    font-size: 11.5px;
    text-transform: none;
  }
  tr:last-child td { border-bottom: none; }
  .decision { font-family: var(--mono); }
  .decision.answered { color: var(--safe); }
  .decision.blocked_input, .decision.blocked_output { color: var(--leak); }

  .quotable-flag {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 3px;
    margin-left: 10px;
  }
  .quotable-flag.yes { background: rgba(63,185,80,.15); color: var(--safe); }
  .quotable-flag.no { background: rgba(248,81,73,.15); color: var(--leak); }

  .empty-state {
    color: var(--text-dim);
    font-size: 13px;
    padding: 24px;
    text-align: center;
    border: 1px dashed var(--panel-border);
  }

  .banner {
    border: 1px solid var(--leak);
    color: var(--leak);
    border-radius: 6px;
    padding: 10px 14px;
    margin: 0 0 16px;
    font-size: 13px;
  }
  .banner.info { border-color: var(--accent); color: var(--accent); }
  .run-local {
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .run-local strong { color: var(--text); display: block; margin-bottom: 4px; }
  .example { border: 1px solid var(--panel-border); border-radius: 6px; padding: 12px 14px; margin-bottom: 12px; background: var(--panel); }
  .example .cat { color: var(--accent); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .example pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; font-family: var(--mono); font-size: 12px; }
  .example .lbl { color: var(--text-dim); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="shell">

  <aside class="rail">
    <h1>Zero-Exposure RAG</h1>
    <p class="sub">Red-team results &amp; live query</p>

    <div class="field">
      <label for="role">Role</label>
      <select id="role">
        <option value="support_agent">Support Agent</option>
        <option value="fraud_analyst">Fraud Analyst</option>
        <option value="compliance_officer">Compliance Officer</option>
      </select>
    </div>
    <div class="field">
      <label for="token">Token</label>
      <input id="token" type="password" placeholder="paste token — never stored" autocomplete="off" />
    </div>
    <div class="field">
      <label for="query">Query</label>
      <textarea id="query" placeholder="What's this customer's account status?"></textarea>
    </div>
    <button id="sendBtn">Ask</button>

    <div class="live-answer" id="liveAnswer">
      <span class="tag" id="liveTag"></span>
      <div class="answer-text" id="liveText"></div>
      <div class="meta" id="liveMeta"></div>
    </div>
    </div>
  </aside>

  <main>
    <p class="section-title">
      Results
      <span class="quotable-flag" id="quotableFlag"></span>
    </p>

    <div class="tiles" id="tiles"></div>

    <div class="chart-panel">
      <p class="section-title" style="margin-bottom:16px;">Attack success rate — guards off vs on</p>
      <canvas id="asrChart"></canvas>
    </div>

    <div id="examplesWrap" style="display:none;">
      <p class="section-title">Recorded examples (guards off vs on)</p>
      <div id="examples"></div>
    </div>
    <p class="section-title" id="auditTitle">Latest audit rows</p>
    <div id="auditWrap">
      <table id="auditTable" style="display:none;">
        <thead>
          <tr><th>Time</th><th>Role</th><th>Decision</th><th>Reason</th><th>Sources</th></tr>
        </thead>
        <tbody id="auditBody"></tbody>
      </table>
      <div class="empty-state" id="auditEmpty">No audit rows to show.</div>
    </div>
  </main>

</div>

<script src="config.js"></script>
<script src="vendor/chart.umd.min.js"></script>
<script>
const STATIC = (window.DASHBOARD_CONFIG || {}).mode === "static";
const DATA_BASE = STATIC ? "data/" : "";

async function fetchJSON(url, options) {
  try {
    const r = await fetch(url, options);
    if (!r.ok) return null;
    return await r.json();
  } catch {
    return null;
  }
}

function esc(x) {
  return String(x ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function pct(x) {
  return x === null || x === undefined ? "—" : (x * 100).toFixed(1) + "%";
}

// Prefer the held-out test split when it has scored attacks, otherwise dev.
function pickSplit(result) {
  const total = (s) => Object.values(result.by_split?.[s]?.attacks?.on?.by_category || {})
    .reduce((n, c) => n + (c.total || 0), 0);
  return total("test") > 0 ? "test" : "dev";
}

function renderResults(result) {
  const pending = document.getElementById("pending");
  const banner = document.getElementById("notQuotable");
  const flag = document.getElementById("quotableFlag");
  if (!result || !result.by_split) {
    pending.style.display = "block";
    document.getElementById("tiles").innerHTML = "";
    document.getElementById("chartPanel").style.display = "none";
    return;
  }
  const split = pickSplit(result);
  const dev = result.by_split?.[split]?.attacks;
  const off = dev?.off, on = dev?.on;
  const tiles = [
    { label: `ASR — guards off (${split})`, value: pct(off?.overall_asr), cls: "leak" },
    { label: `ASR — guards on (${split})`, value: pct(on?.overall_asr), cls: "safe" },
    { label: "PII leakage — on", value: pct(on?.pii_leakage_rate), cls: "safe" },
    { label: "Benign false-block", value: pct(result.benign_false_block_rate), cls: "" },
    { label: "Errors excluded", value: result.error_count ?? "—", cls: "" },
    { label: "Invalid records", value: result.invalid_records ?? "—", cls: "" },
  ];
  document.getElementById("tiles").innerHTML = tiles.map(t => `
    <div class="tile">
      <div class="num ${t.cls}">${t.value}</div>
      <div class="label">${t.label}</div>
    </div>`).join("");
  flag.textContent = result.quotable ? "quotable" : "not quotable";
  flag.className = "quotable-flag " + (result.quotable ? "yes" : "no");
  if (!result.quotable) {
    const why = (result.quotable_reasons || []).join("; ");
    banner.textContent = "Not quotable" + (why ? ": " + why : "") + ". Do not cite these numbers.";
    banner.style.display = "block";
  }
  renderChart(off?.by_category || {}, on?.by_category || {});
}

function renderChart(off, on) {
  const categories = Array.from(new Set([...Object.keys(off), ...Object.keys(on)]));
  new Chart(document.getElementById("asrChart"), {
    type: "bar",
    data: {
      labels: categories,
      datasets: [
        { label: "Guards off", data: categories.map(c => (off[c]?.attack_success_rate ?? 0) * 100), backgroundColor: "#F85149" },
        { label: "Guards on", data: categories.map(c => (on[c]?.attack_success_rate ?? 0) * 100), backgroundColor: "#3FB950" },
      ],
    },
    options: {
      responsive: true,
      scales: {
        y: { beginAtZero: true, max: 100, ticks: { color: "#8B949E", callback: v => v + "%" },
             grid: { color: "#30363D" } },
        x: { ticks: { color: "#8B949E" }, grid: { display: false } },
      },
      plugins: { legend: { labels: { color: "#E6EDF3" } } },
    },
  });
}

function renderExamples(examples) {
  const wrap = document.getElementById("examplesWrap");
  if (!examples || examples.length === 0) return;
  wrap.style.display = "block";
  document.getElementById("examples").innerHTML = examples.map(e => `
    <div class="example">
      <div class="cat">${esc(e.category)} · ${esc(e.role)}</div>
      <div class="lbl">Prompt</div><pre>${esc(e.prompt)}</pre>
      <div class="lbl">Guards off answer</div><pre>${esc(e.guards_off_answer)}</pre>
      <div class="lbl">Guards on outcome</div><pre>${esc(e.guards_on_outcome)}</pre>
    </div>`).join("");
}

function renderAudit(rows) {
  const table = document.getElementById("auditTable");
  const body = document.getElementById("auditBody");
  const empty = document.getElementById("auditEmpty");
  if (!rows || rows.length === 0) {
    table.style.display = "none";
    empty.style.display = "block";
    return;
  }
  table.style.display = "table";
  empty.style.display = "none";
  body.innerHTML = rows.map(r => `
    <tr>
      <td>${esc((r.timestamp || "").replace("T", " ").replace(/\+.*/, ""))}</td>
      <td>${esc(r.role || "—")}</td>
      <td class="decision ${esc(r.decision)}">${esc(r.decision)}</td>
      <td>${esc(r.block_reason || "—")}</td>
      <td>${esc((r.retrieved_doc_ids || []).join(", ") || "—")}</td>
    </tr>`).join("");
}

// Live mode: /audit needs a compliance token, taken from the form.
async function refreshAudit() {
  const token = document.getElementById("token").value.trim();
  if (!token) {
    document.getElementById("auditEmpty").textContent = "Enter a compliance officer token to load audit rows.";
    return;
  }
  const audit = await fetchJSON("/audit?limit=20", { headers: { "X-User-Token": token } });
  if (audit) {
    renderAudit(audit.rows || []);
  } else {
    document.getElementById("auditEmpty").textContent = "Audit rows need a compliance officer token.";
    renderAudit([]);
  }
}

async function loadDashboard() {
  renderResults(await fetchJSON(DATA_BASE + "results.json"));
  if (STATIC) {
    document.getElementById("liveForm").style.display = "none";
    document.getElementById("runLocal").style.display = "block";
    document.getElementById("auditTitle").textContent = "Sample audit rows";
    renderExamples(await fetchJSON("data/examples.json"));
    renderAudit(await fetchJSON("data/audit_sample.json"));
  } else {
    refreshAudit();
  }
}

const ROLE_EXAMPLES = {
  support_agent: "What is the policy for disputing a card transaction?",
  fraud_analyst: "Why was a suspicious transaction velocity case opened for customer c_001?",
  compliance_officer: "What did the quarterly OFAC sanctions screening audit conclude?",
};
document.getElementById("role").addEventListener("change", (e) => {
  const example = ROLE_EXAMPLES[e.target.value];
  if (example) {
    document.getElementById("query").value = example;
  }
});
document.getElementById("token").addEventListener("change", refreshAudit);

document.getElementById("sendBtn").addEventListener("click", async () => {
  const token = document.getElementById("token").value.trim();
  const query = document.getElementById("query").value.trim();
  const btn = document.getElementById("sendBtn");
  if (!token || !query) return;
  btn.disabled = true;
  btn.textContent = "Asking…";
  const box = document.getElementById("liveAnswer");
  const tag = document.getElementById("liveTag");
  try {
    const r = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-User-Token": token },
      body: JSON.stringify({ query }),
    });
    const body = await r.json().catch(() => ({}));
    box.classList.add("show");
    if (!r.ok) {
      tag.textContent = `request failed (HTTP ${r.status})`;
      tag.className = "tag blocked";
      document.getElementById("liveText").textContent =
        typeof body.detail === "string" ? body.detail : "(request rejected)";
      document.getElementById("liveMeta").textContent = "";
      return;
    }
    tag.textContent = body.blocked ? `blocked — ${body.block_reason}` : "answered";
    tag.className = "tag " + (body.blocked ? "blocked" : "answered");
    document.getElementById("liveText").textContent = body.answer || "(no answer)";
    const l = body.latency_ms || {};
    const inGuard = body.guards?.input;
    const outGuard = body.guards?.output;
    document.getElementById("liveMeta").textContent =
      `sources: ${(body.sources || []).join(", ") || "none"} · ` +
      `latency: in=${l.input_guard ?? "—"}ms ret=${l.retrieval ?? "—"}ms llm=${l.llm ?? "—"}ms out=${l.output_guard ?? "—"}ms · ` +
      `input: ${inGuard?.label ?? "—"} (${typeof inGuard?.score === "number" ? inGuard.score.toFixed(2) : "—"}) · ` +
      `output redactions: ${outGuard?.redaction_count ?? "—"}`;
  } catch (e) {
    box.classList.add("show");
    tag.textContent = "request failed";
    tag.className = "tag blocked";
    document.getElementById("liveText").textContent = String(e);
  } finally {
    btn.disabled = false;
    btn.textContent = "Ask";
    refreshAudit();
  }
});

loadDashboard();
</script>
</body>
</html>
